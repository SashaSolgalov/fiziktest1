<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4fa0">
<title>FizikTest</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--primary:#1a4fa0;--ok:#1a7f37;--err:#b3261e;--hint:#666;--border:#d9dce3;--radius:14px;--text:#222;--option-bg:#fafbfc}
[data-theme="dark"] {--bg:#121212;--card:#1e1e1e;--primary:#66b2ff;--ok:#4caf50;--err:#cf6679;--hint:#aaa;--border:#333;--text:#e0e0e0;--option-bg:#2c2c2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);transition:background 0.3s, color 0.3s;}
body{min-height:100vh;padding:12px 12px 140px;font-size:16px;line-height:1.4}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;color:var(--primary);line-height:1.2}
h1 small{font-weight:normal;font-size:12px;color:var(--hint);display:block;margin-top:3px}
.icon-btn{background:none;border:none;padding:10px;font-size:22px;cursor:pointer;border-radius:8px;color:var(--text)}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.timer-wrap {display:flex; justify-content:space-between; align-items:center; background:var(--card); padding:12px 16px; border-radius:var(--radius); margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); font-weight:600;}
.timer-label {font-size:14px; color:var(--hint);}
.timer-clock {font-size:20px; color:var(--primary); font-variant-numeric: tabular-nums;}
.timer-clock.warn {color:#d97706;}
.timer-clock.danger {color:var(--err); animation: pulse 1s infinite;}
@keyframes pulse {0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;}}
.topic-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;}
.topic-bar::-webkit-scrollbar {height: 8px;}
.topic-bar::-webkit-scrollbar-track {background: var(--bg); border-radius: 4px;}
.topic-bar::-webkit-scrollbar-thumb {background: var(--border); border-radius: 4px;}
.topic-bar::-webkit-scrollbar-thumb:hover {background: var(--hint);}
.chip{flex:0 0 auto;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:22px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--text)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.counter{font-size:13px;color:var(--hint);margin-bottom:8px}
.question{font-size:17px;line-height:1.45;margin-bottom:14px;font-weight:500}
.option{display:flex;align-items:center;width:100%;text-align:left;padding:16px;margin-bottom:10px;background:var(--option-bg);border:2px solid var(--border);border-radius:12px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--text);min-height:56px;transition:all .15s}
.option.selected{border-color:var(--primary);background:var(--bg)}
.option.correct{border-color:var(--ok);background:rgba(26,127,55,0.1)}
.option.trap{border-color:var(--err);background:rgba(179,38,30,0.1)}
.option:disabled{cursor:default}
.option:disabled:not(.correct):not(.trap){opacity:.55}
#btnCheck{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;margin-top:6px;font-family:inherit;cursor:pointer;background:var(--primary);color:#fff;min-height:56px}
#feedback{display:none;padding:14px;border-radius:12px;font-size:15px;line-height:1.5;margin-top:6px}
#feedback.show{display:block}
#feedback.ok{background:rgba(26,127,55,0.1);color:var(--ok)}
#feedback.err{background:rgba(179,38,30,0.1);color:var(--err)}
#feedback strong{display:block;margin-bottom:8px;font-size:16px}
.theory-box{margin-top:12px;padding:12px;background:var(--bg);border-radius:10px;color:var(--primary);font-size:14px;line-height:1.5}
.theory-box code{display:block;background:var(--card);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px;white-space:pre-wrap}
.fab-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent);display:flex;gap:10px;z-index:10}
.fab-bar button{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;min-height:56px}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--card);color:var(--primary);border:2px solid var(--primary)!important}
.fab-bar button:disabled{opacity:.4;cursor:default}
.status{position:fixed;left:0;right:0;bottom:90px;text-align:center;font-size:12px;color:var(--hint);pointer-events:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;color:var(--text)}
.modal h2{margin:0 0 14px;font-size:19px;color:var(--primary)}
.modal pre{background:var(--bg);padding:10px 12px;border-radius:8px;white-space:pre-wrap;font-size:13px;color:var(--primary);margin:8px 0}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px;gap:12px}
.stat-row span:last-child{font-weight:600;color:var(--primary);white-space:nowrap}
.btn-close{width:100%;padding:14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;margin-top:16px;cursor:pointer;font-family:inherit}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:200px;padding:6px;z-index:50;display:none}
.menu.show{display:block;}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;background:none;border-radius:8px;font-size:15px;font-family:inherit;text-align:left;cursor:pointer;color:var(--text);min-height:48px}
.menu-danger{color:var(--err)}

#certificate { display: none; background: #fff; color: #222; border: 10px double #1a4fa0; border-radius: 8px; padding: 20px; text-align: center; margin: 20px auto; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-family: 'Times New Roman', serif; }
#certificate h2 { color: #1a4fa0; font-size: 24px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 2px; }
#certificate .cert-name { font-size: 28px; font-weight: bold; margin: 15px 0; border-bottom: 2px solid #1a4fa0; display: inline-block; padding-bottom: 5px; }
#certificate .cert-text { font-size: 16px; margin: 10px 0; line-height: 1.5; }
#certificate .cert-score { font-size: 36px; color: #1a7f37; font-weight: bold; margin: 10px 0; }
#certificate .cert-footer { font-size: 12px; color: #666; margin-top: 20px; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>FizikTest<small>тренажёр по кинематике</small></h1>
  <div style="display:flex; align-items:center; gap:4px; position:relative">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" id="menuBtn" onclick="toggleMenu(event)">☰</button>
    <div id="menu" class="menu">
      <button type="button" class="menu-item" onclick="showSupport()">💬 Поддержать</button>
      <button type="button" class="menu-item" onclick="showStats()">📊 Статистика</button>
      <button type="button" class="menu-item menu-danger" onclick="resetAll()">🔄 Сбросить</button>
    </div>
  </div>
</header>

<div class="timer-wrap">
  <div class="timer-label">⏱ Осталось времени:</div>
  <div class="timer-clock" id="timerDisplay">00:00</div>
</div>

<div class="topic-bar" id="topics"></div>

<div class="card">
  <div class="counter" id="counter"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <div id="feedback"></div>
</div>

<div class="status" id="status"></div>

<div class="fab-bar">
  <button type="button" class="btn-secondary" id="btnTheory" onclick="showTheory()" disabled>📘 Теория</button>
  <button type="button" class="btn-primary" id="btnNext" onclick="nextTask()" disabled>Следующая →</button>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
"use strict";

// ==================== БАЗА ЗАДАЧ (3 темы по 5 задач) ====================
const TASKS = [
// --- ТЕМА 1: Равномерное движение (5) ---
{id:1,lvl:"school",topic:"Равномерное движение",text:"Плот равномерно плывет по реке со скоростью 6 км/ч. Человек движется поперек плота со скоростью 8 км/ч. Чему равна скорость человека в системе отсчета, связанной с берегом? (Контрольная работа по Мякишеву)",unit:"км/ч",correct:10,options:["10","7","14","2"],
 traps:{"7":{et:"VECTOR",c:"Скорости направлены перпендикулярно. Сложение выполняется по теореме Пифагора: v = √(6² + 8²) = 10 км/ч."},"14":{et:"VECTOR",c:"Скорости сложены как скаляры (6+8). Для перпендикулярных направлений применяется векторное сложение."},"2":{et:"VECTOR",c:"Скорости вычтены (8−6). Векторы направлены перпендикулярно, поэтому вычитание не даёт результирующую скорость."}}},
{id:2,lvl:"school",topic:"Равномерное движение",text:"Автомобиль едет со скоростью 72 км/ч. Какой путь он проедет за 30 минут?",unit:"км",correct:36,options:["36","2160","2.4","72"],
 traps:{"2160":{et:"UNITS",c:"Ошибка в единицах измерения. Время необходимо перевести в часы: 30 мин = 0,5 ч. Тогда s = v·t = 72 · 0,5 = 36 км."},"2.4":{et:"FORMULA",c:"Неверная формула. При равномерном движении путь равен произведению скорости на время: s = v·t."},"72":{et:"INITIAL_FINAL",c:"Данное значение — это скорость, а не путь. Путь вычисляется по формуле s = v·t."}}},
{id:3,lvl:"school",topic:"Равномерное движение",text:"Переведи скорость 54 км/ч в м/с.",unit:"м/с",correct:15,options:["15","54","194.4","5.4"],
 traps:{"54":{et:"UNITS",c:"Числовое значение не изменилось. Для перевода км/ч в м/с необходимо разделить на 3,6: 54 : 3,6 = 15 м/с."},"194.4":{et:"UNITS",c:"Использовано умножение вместо деления. Верный коэффициент перевода: 1 км/ч = 1/3,6 м/с."},"5.4":{et:"UNITS",c:"Неверный коэффициент деления. В 1 км — 1000 м, в 1 ч — 3600 с, поэтому делим на 3,6."}}},
{id:4,lvl:"school",topic:"Равномерное движение",text:"Велосипедист едет со скоростью 5 м/с. Какой путь он проедет за 2 минуты?",unit:"м",correct:600,options:["600","10","0.04","5"],
 traps:{"10":{et:"UNITS",c:"Время не переведено в секунды. 2 минуты = 120 с, следовательно s = 5 · 120 = 600 м."},"0.04":{et:"FORMULA",c:"Применено деление вместо умножения. Путь при равномерном движении: s = v·t."},"5":{et:"INITIAL_FINAL",c:"Выбрано значение скорости вместо пути. Путь равен s = v·t."}}},
{id:5,lvl:"school",topic:"Равномерное движение",text:"Поезд движется со скоростью 90 км/ч. Какой путь он пройдёт за 20 минут?",unit:"км",correct:30,options:["30","1800","1.5","90"],
 traps:{"1800":{et:"UNITS",c:"Ошибка перевода времени. 20 минут = 1/3 часа. s = 90 · (1/3) = 30 км."},"1.5":{et:"FORMULA",c:"Применено деление вместо умножения. Верная формула: s = v·t."},"90":{et:"INITIAL_FINAL",c:"Данное значение — скорость, а не путь."}}},

// --- ТЕМА 2: Равноускоренное движение (5) ---
{id:6,lvl:"school",topic:"Равноускоренное движение",text:"Зависимость пути от времени для прямолинейно движущегося тела имеет вид: S = 2t + t², где все величины выражены в СИ. Ускорение тела равно: (Контрольная работа по Мякишеву)",unit:"м/с²",correct:2,options:["2","1","4","3"],
 traps:{"1":{et:"FORMULA",c:"Коэффициент при t² равен a/2. Если он равен 1, то a = 2 м/с²."},"4":{et:"FORMULA",c:"Ускорение в два раза больше коэффициента при t². a = 2·1 = 2 м/с²."},"3":{et:"FORMULA",c:"Неверный расчёт. Из уравнения S = v₀t + at²/2 следует, что a/2 = 1, значит a = 2 м/с²."}}},
{id:7,lvl:"school",topic:"Равноускоренное движение",text:"Тело начинает движение из состояния покоя с ускорением 3 м/с². Какой путь оно пройдёт за 4 с?",unit:"м",correct:24,options:["24","48","12","6"],
 traps:{"48":{et:"FORMULA",c:"Пропущен коэффициент 1/2 в формуле пути: s = at²/2 = 3·16/2 = 24 м."},"12":{et:"INITIAL_FINAL",c:"12 м/с — это конечная скорость (v = at = 3·4), а не путь."},"6":{et:"FORMULA",c:"Время не возведено в квадрат. Верная формула: s = at²/2 = 24 м."}}},
{id:8,lvl:"school",topic:"Равноускоренное движение",text:"Автомобиль разгоняется с 10 м/с до 20 м/с за 5 секунд. Какое ускорение у автомобиля?",unit:"м/с²",correct:2,options:["2","4","10","30"],
 traps:{"4":{et:"FORMULA",c:"Использована конечная скорость вместо разности скоростей. a = (v − v₀)/t = (20 − 10)/5 = 2 м/с²."},"10":{et:"INITIAL_FINAL",c:"10 м/с — это начальная скорость, а не ускорение."},"30":{et:"FORMULA",c:"Скорости сложены. Ускорение — это разность скоростей, делённая на время."}}},
{id:9,lvl:"school",topic:"Равноускоренное движение",text:"Тело движется с ускорением 2 м/с². Начальная скорость 4 м/с. Какой путь тело пройдёт за 3 с?",unit:"м",correct:21,options:["21","18","12","30"],
 traps:{"18":{et:"FORMULA",c:"Не учтена начальная скорость: s = v₀t + at²/2 = 12 + 9 = 21 м."},"12":{et:"INITIAL_FINAL",c:"12 м — это только путь равномерной части (v₀t). Нужно учесть ускорение."},"30":{et:"FORMULA",c:"Неверный расчёт. Верное значение: s = 21 м."}}},
{id:10,lvl:"school",topic:"Равноускоренное движение",text:"Скорость тела за 4 с выросла с 0 до 8 м/с. Какой путь оно прошло?",unit:"м",correct:16,options:["16","32","32.5","8"],
 traps:{"32":{et:"FORMULA",c:"Использовано произведение конечной скорости на время. Путь: s = v_ср·t = (0+8)/2 · 4 = 16 м."},"32.5":{et:"FORMULA",c:"Неверный расчёт. Верное значение: s = 16 м."},"8":{et:"INITIAL_FINAL",c:"8 м/с — это конечная скорость, а не путь."}}},

// --- ТЕМА 3: Движение по вертикали (5) ---
{id:11,lvl:"school",topic:"Движение по вертикали",text:"Тело брошено вертикально вверх со скоростью 30 м/с. На какой высоте его скорость уменьшится в 3 раза? (g = 10 м/с²) (Задачник Рымкевича, №215)",unit:"м",correct:40,options:["40","45","30","20"],
 traps:{"45":{et:"FORMULA",c:"Конечная скорость v = 30/3 = 10 м/с. Высота: h = (v₀² − v²)/(2g) = (900 − 100)/20 = 40 м."},"30":{et:"INITIAL_FINAL",c:"30 м/с — это начальная скорость, а не высота."},"20":{et:"FORMULA",c:"Неверный расчёт. Верное значение: h = 40 м."}}},
{id:12,lvl:"school",topic:"Движение по вертикали",text:"Тело падает с высоты 20 м без начальной скорости (g = 10 м/с²). Сколько времени длится падение?",unit:"с",correct:2,options:["2","4","1","20"],
 traps:{"4":{et:"FORMULA",c:"Не извлечён корень. t = √(2h/g) = √(2·20/10) = √4 = 2 с."},"1":{et:"FORMULA",c:"Применена неверная формула. Верное значение: t = 2 с."},"20":{et:"INITIAL_FINAL",c:"20 м — это высота, а не время падения."}}},
{id:13,lvl:"school",topic:"Движение по вертикали",text:"Тело свободно падает 3 с (g = 10 м/с²). Какой путь оно пройдёт?",unit:"м",correct:45,options:["45","90","30","15"],
 traps:{"90":{et:"FORMULA",c:"Пропущен коэффициент 1/2: h = gt²/2 = 10·9/2 = 45 м."},"30":{et:"INITIAL_FINAL",c:"30 м/с — это скорость (gt), а не путь."},"15":{et:"AVERAGE",c:"15 м/с — это средняя скорость на участке, а не путь."}}},
{id:14,lvl:"school",topic:"Движение по вертикали",text:"Тело брошено вертикально вверх со скоростью 20 м/с (g = 10 м/с²). На какую максимальную высоту оно поднимется?",unit:"м",correct:20,options:["20","40","2","10"],
 traps:{"40":{et:"FORMULA",c:"Пропущен коэффициент 1/2 в знаменателе: H = v₀²/(2g) = 400/20 = 20 м."},"2":{et:"INITIAL_FINAL",c:"2 с — это время подъёма (t = v₀/g), а не высота."},"10":{et:"FORMULA",c:"10 м/с — это средняя скорость на подъёме, а не высота."}}},
{id:15,lvl:"school",topic:"Движение по вертикали",text:"Тело брошено вертикально вверх со скоростью 20 м/с (g = 10 м/с²). Через какое время оно окажется в верхней точке?",unit:"с",correct:2,options:["2","4","20","0.5"],
 traps:{"4":{et:"INITIAL_FINAL",c:"4 с — это полное время полёта. Время до верхней точки: t = v₀/g = 2 с."},"20":{et:"INITIAL_FINAL",c:"20 м/с — это скорость, а не время."},"0.5":{et:"FORMULA",c:"Формула перевёрнута. Верное значение: t = 2 с."}}}
];

const THEORY = {
UNITS:{f:"1 км/ч = 1/3,6 м/с;  1 мин = 60 с;  1 км = 1000 м",t:"Все величины подставляются в формулу в единицах СИ: путь — в метрах, время — в секундах, скорость — в м/с."},
FORMULA:{f:"s = v·t;  v = s/t;  v = v₀ + at;  s = v₀t + at²/2;  s = (v² − v₀²)/(2a)",t:"Прежде чем считать, выпиши, какая величина дана и какая иском. Подбирай формулу, в которой ровно эти величины."},
SIGN:{f:"торможение: a < 0,  s = v₀t − |a|t²/2",t:"Если тело тормозит, ускорение направлено против скорости, поэтому подставляется со знаком минус."},
AVERAGE:{f:"v_ср = (s₁+s₂)/(t₁+t₂);  равные пути: v_ср = 2v₁v₂/(v₁+v₂)",t:"Средняя скорость — это весь путь на всё время. Среднее арифметическое скоростей работает только при равных временах."},
GRAPH:{f:"v(t): наклон = a = Δv/Δt, площадь = путь;  x(t): наклон = v",t:"На графике v(t) путь — это площадь под графиком, а ускорение — наклон прямой."},
VECTOR:{f:"навстречу: v = v₁+v₂;  вдогонку: v = |v₁−v₂|;  перпендикулярно: v = √(v₁²+v₂²)",t:"Скорости — векторы. Перпендикулярные скорости складываются по теореме Пифагора."},
INITIAL_FINAL:{f:"v₀ — начальная, v — конечная, v_ср = (v₀+v)/2 при равноускоренном движении",t:"Различай начальную скорость v₀, конечную v и среднюю v_ср."},
UNKNOWN:{f:"s = v·t;  v = v₀ + at;  s = v₀t + at²/2",t:"Проверь единицы измерения и формулу."}
};

const ERR_NAMES = {UNITS:"единицы измерения",FORMULA:"формула",SIGN:"знак",AVERAGE:"средняя скорость",GRAPH:"график",VECTOR:"векторы",INITIAL_FINAL:"путаница величин",UNKNOWN:"не распознано"};

const store = {
  read(){try{return JSON.parse(localStorage.getItem("fiziktest")||"{}")}catch(e){return{}}},
  write(d){try{localStorage.setItem("fiziktest",JSON.stringify(d))}catch(e){}}
};

let state = Object.assign({attempts:[],errors:{},topic:"Все темы",theme:"light", studentName:""},store.read());
if(!Array.isArray(state.attempts)) state.attempts=[];
if(!state.errors||typeof state.errors!=="object") state.errors={};
if(!state.theme) state.theme="light";
const save = () => store.write(state);

let timeLeft = 0;
let timerInterval = null;
let timerPaused = false;
const TIME_LIMIT = 40 * 60;

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function startTimer() {
  clearInterval(timerInterval);
  timerPaused = false;
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (timerPaused) return;
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) { clearInterval(timerInterval); timeUp(); }
  }, 1000);
}
function pauseTimer() { timerPaused = true; }

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const display = $("timerDisplay");
  display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  display.className = "timer-clock";
  if (timeLeft <= 60) display.classList.add("danger");
  else if (timeLeft <= 300) display.classList.add("warn");
}

function timeUp() {
  showFinish();
  setTimeout(() => {
    alert("Время вышло! Тренажер начнется заново.");
    startNewSession();
  }, 500);
}

function normalize(raw){
  if(raw===null||raw===undefined)return null;
  const s = String(raw).trim().replace(/[−–—]/g,"-").replace(/,/g,".").replace(/\s+/g,"");
  const m = s.match(/^[+-]?\d*\.?\d+/);
  if(!m) return null;
  return parseFloat(m[0]);
}
function closeTo(a,b){return Math.abs(a-b)<=Math.max(0.05,Math.abs(b)*1e-3);}

function check(task,raw){
  const ans = normalize(raw);
  const res = {status:"unknown",et:null,comment:"",repeat:false};
  if(ans===null){res.comment="Введите число.";return res;}
  if(closeTo(ans,task.correct)){res.status="correct";return res;}
  for(const key in task.traps){
    if(closeTo(ans,parseFloat(key))){
      const trap=task.traps[key];
      res.status="trap";res.et=trap.et;res.comment=trap.c;
      const prev = state.attempts.filter(x => x.sid===sessionId && x.et===trap.et).length;
      state.errors[trap.et] = (state.errors[trap.et]||0) + 1;
      res.repeat = (prev + 1) >= 2;
      return res;
    }
  }
  res.comment="Неверный ответ. Проверьте единицы измерения и формулу.";
  return res;
}

let queue=[],idx=0,solved=0,mistakes=0,answered=false,lastET=null,selected=null;
let sessionId = Date.now();

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function toggleTheme() {
  state.theme = state.theme === "light" ? "dark" : "light";
  save();
  applyTheme();
}

function applyTheme() {
  if (state.theme === "dark") {
    document.body.setAttribute("data-theme", "dark");
    $("themeBtn").textContent = "☀️";
  } else {
    document.body.removeAttribute("data-theme");
    $("themeBtn").textContent = "🌙";
  }
}

function buildTopics(){
  const bar=$("topics");
  bar.innerHTML="";
  const topics=["Все темы",...[...new Set(TASKS.map(t=>t.topic))].sort()];
  topics.forEach(tp=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="chip"+(tp===state.topic?" active":"");
    b.textContent=tp;
    b.onclick=()=>{
      if(tp===state.topic && (solved+mistakes>0) && !confirm("Начать тему заново?")) return;
      setTopic(tp);
      buildTopics();
    };
    bar.appendChild(b);
  });
}

function setTopic(tp){
  const validTopics=["Все темы",...new Set(TASKS.map(t=>t.topic))];
  if(!validTopics.includes(tp)) tp="Все темы";
  state.topic=tp;
  save();
  
  let baseQueue = TASKS.filter(t=>tp==="Все темы"||t.topic===tp);
  queue = shuffleArray([...baseQueue]); 
  
  queue.forEach(t => {
    t.options = shuffleArray([...t.options]);
  });
  
  idx=0;solved=0;mistakes=0;answered=false;lastET=null;selected=null;
  sessionId = Date.now();
  $("btnTheory").disabled=true;$("btnNext").disabled=true;
  
  if (queue.length > 0) startTimer();
  else {
    clearInterval(timerInterval);
    timeLeft = TIME_LIMIT;
    updateTimerDisplay();
  }
  showTask();
}

function startNewSession() { setTopic(state.topic); }

function showTask(){
  $("btnNext").textContent="Следующая →";
  $("options").innerHTML="";
  $("feedback").className=""; $("feedback").innerHTML="";
  selected=null;answered=false;lastET=null;
  $("btnTheory").disabled=true; $("btnNext").disabled=true;

  if(!queue.length){
    $("counter").textContent="";
    $("question").textContent="В этой теме пока нет задач.";
    $("status").textContent="";
    return;
  }
  if(idx>=queue.length){showFinish();return;}

  const t=queue[idx];
  $("counter").textContent="Тема: "+t.topic+" · Задача "+(idx+1)+" из "+queue.length;
  $("question").textContent=t.text;

  const box=$("options");
  t.options.forEach(opt=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="option";
    btn.textContent=String(opt).replace("-","−")+" "+t.unit;
    btn.dataset.value=String(opt);
    btn.onclick=()=>{
      if(answered)return;
      selected=String(opt);
      [...box.querySelectorAll(".option")].forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
    };
    box.appendChild(btn);
  });

  const checkBtn=document.createElement("button");
  checkBtn.type="button"; checkBtn.id="btnCheck"; checkBtn.textContent="Проверить";
  checkBtn.onclick=doCheck;
  box.appendChild(checkBtn);
  updateStatus();
}

function doCheck(){
  if(answered||!queue.length||idx>=queue.length)return;
  
  const checkBtn = $("btnCheck");
  if (checkBtn) checkBtn.disabled = true;

  if(!selected){
    $("feedback").className="show err";
    $("feedback").innerHTML="<strong>Сначала выбери вариант ответа.</strong>";
    if (checkBtn) checkBtn.disabled = false;
    return;
  }
  
  pauseTimer();
  const t=queue[idx];
  const res=check(t,selected);

  state.attempts.push({id:t.id,topic:t.topic,answer:selected,status:res.status,et:res.et,sid:sessionId,time:new Date().toISOString()});
  answered=true; lastET=res.et;

  const box=$("options");
  [...box.children].forEach(b=>{
    b.disabled=true;
    if(b.id==="btnCheck")return;
    if(closeTo(normalize(b.dataset.value),t.correct)) b.classList.add("correct");
    else if(b.dataset.value===selected) b.classList.add("trap");
  });

  $("btnTheory").disabled=!lastET; $("btnNext").disabled=false;
  const fb=$("feedback");
  if(res.status==="correct"){
    solved++;
    fb.className="show ok";
    fb.innerHTML="<strong>✅ Верно!</strong>Правильный ответ: "+t.correct+" "+t.unit+".";
  } else {
    mistakes++;
    fb.className="show err";
    let html="<strong>❌ Неверно.</strong>";
    if(res.status==="trap") html+="<div style='font-size:13px;color:var(--hint);margin-bottom:6px'>Тип ошибки: "+(ERR_NAMES[res.et]||res.et)+"</div>";
    html+="<div>"+esc(res.comment)+"</div>";
    if(res.repeat){
      const th=THEORY[res.et];
      if(th) html+="<div class='theory-box'><div style='font-weight:600;margin-bottom:6px'>📘 Повторная ошибка. Мини-теория:</div><code>"+esc(th.f)+"</code><div>"+esc(th.t)+"</div></div>";
    }
    fb.innerHTML=html;
  }
  save(); updateStatus();
}

function nextTask(){ 
  if(idx+1<queue.length){
    idx++;
    showTask();
    timerPaused = false;
  } else{ showFinish(); } 
}

function showFinish(){
  clearInterval(timerInterval);
  
  const acc = queue.length ? Math.round(solved/queue.length*100) : 0;
  
  const certHTML = `
    <div id="certificate" style="display:block; margin:0 auto; background:#fff; color:#222;">
      <h2>Грамота</h2>
      <div class="cert-text">Настоящим подтверждается, что</div>
      <div class="cert-name">${esc(state.studentName || "Ученик")}</div>
      <div class="cert-text">успешно прошел(ла) тестирование по физике<br><b>«Кинематика»</b></div>
      <div class="cert-score">${solved} / ${queue.length}</div>
      <div class="cert-text">Правильных ответов.<br>Точность: <b>${acc}%</b></div>
      <div class="cert-footer">Тренажёр FizikTest · ${new Date().toLocaleDateString('ru-RU')}</div>
    </div>
  `;

  openModal(`
    <h2>🎉 Тест завершен!</h2>
    ${certHTML}
    <button class="btn-close" onclick="closeModal(); startNewSession();">Пройти еще раз</button>
  `);

  sendResultToTelegram(solved, queue.length);

  $("counter").textContent="Итог · задач: "+queue.length;
  $("question").textContent="Вы прошли тест! Ваша грамота выше.";
  $("options").innerHTML="";
  $("feedback").className=""; $("feedback").innerHTML="";
  $("btnTheory").disabled=true; $("btnNext").disabled=true; $("btnNext").textContent="Готово";
}

function sendResultToTelegram(score, total) {
  // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
  const url = 'ВАША_ССЫЛКА_ИЗ_GOOGLE_APPS_SCRIPT'; 
  if (url === 'ВАША_ССЫЛКА_ИЗ_GOOGLE_APPS_SCRIPT') return;

  const data = {
    name: state.studentName || "Ученик",
    level: "Школа",
    score: score,
    total: total
  };

  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).catch(err => console.log('Ошибка отправки:', err));
}

function updateStatus(){
  $("status").textContent="Верно: "+solved+" · Ошибок: "+mistakes+" · Задача "+Math.min(idx+1,queue.length)+" из "+queue.length;
}

function openModal(html){ $("modalContent").innerHTML=html; $("modal").classList.add("show"); }
function closeModal(){ $("modal").classList.remove("show"); }

function showTheory(){
  if(!lastET)return;
  const th=THEORY[lastET]||THEORY.UNKNOWN;
  openModal("<h2>📘 Теория по ошибке</h2><div style='font-size:13px;color:var(--hint);margin-bottom:10px'>Тип: "+(ERR_NAMES[lastET]||lastET)+"</div><div style='font-weight:600;margin-bottom:4px'>Формулы:</div><pre>"+esc(th.f)+"</pre><div style='font-weight:600;margin:12px 0 4px'>Что важно помнить:</div><div style='font-size:14px;line-height:1.5'>"+esc(th.t)+"</div><button class='btn-close' onclick='closeModal()'>Понятно</button>");
}

function showStats(){
  const a=state.attempts; const total=a.length;
  const ok=a.filter(x=>x.status==="correct").length;
  const acc=total?Math.round(ok/total*100):0;
  let html="<h2>📊 Статистика</h2><div class='stat-row'><span>Всего попыток</span><span>"+total+"</span></div><div class='stat-row'><span>Верно</span><span>"+ok+"</span></div><div class='stat-row'><span>Неверно</span><span>"+(total-ok)+"</span></div><div class='stat-row'><span>Точность</span><span>"+acc+"%</span></div>";
  const errs=Object.entries(state.errors).sort((a,b)=>b[1]-a[1]);
  if(errs.length){
    html+="<div style='font-size:13px;text-transform:uppercase;color:var(--hint);margin:14px 0 6px'>Частые ошибки</div>";
    errs.forEach(([et,n])=>{html+="<div class='stat-row'><span>"+(ERR_NAMES[et]||et)+"</span><span>"+n+"</span></div>";});
  }
  html+="<button class='btn-close' onclick='closeModal()'>Закрыть</button>";
  openModal(html);
}

function showSupport(){
  openModal("<h2>💬 Поддержать проект</h2><div style='font-size:15px;line-height:1.55;margin-bottom:16px'>Если тренажёр оказался полезным — напиши автору в Telegram.</div><div style='background:var(--bg);border-radius:10px;padding:16px;text-align:center;font-size:22px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin-bottom:16px'>@xertttte</div><a href='https://t.me/xertttte' target='_blank' rel='noopener' style='display:block;text-align:center;padding:16px;background:var(--primary);color:#fff;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px;margin-bottom:10px'>Открыть в Telegram</a><button class='btn-close' onclick='closeModal()'>Закрыть</button>");
}

function resetAll(){
  if(!confirm("Сбросить всю статистику и начать заново?"))return;
  state.attempts=[]; state.errors={}; state.studentName=""; save();
  setTopic("Все темы");
}

function toggleMenu(e){
  if(e) e.stopPropagation();
  const m=$("menu"), b=$("menuBtn");
  const willOpen = !m.classList.contains("show");
  m.classList.toggle("show", willOpen);
}
function closeMenu(){ $("menu").classList.remove("show"); }

document.addEventListener("click", (e)=>{
  const m=$("menu");
  if(!m.classList.contains("show")) return;
  if(!e.target.closest("#menu") && !e.target.closest("#menuBtn")) closeMenu();
});

function askNameAndStart() {
  let name = prompt("Введите ваше имя и фамилию для грамоты:", state.studentName || "");
  if (name) {
    state.studentName = name.trim();
    save();
  } else if (!state.studentName) {
    state.studentName = "Ученик";
  }
  applyTheme();
  buildTopics();
  setTopic("Все темы");
}

window.onload = () => {
  askNameAndStart();
};
</script>
